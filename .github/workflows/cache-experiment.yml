name: Cache Experiment

# CI cache 改善案を縮約 workflow で実測する実験台 (Refs #28)。
#
# 既存 `ci.yml` (= ippoan/ci-workflows の rust-ci.yml caller) は触らない。
# このワークフローは required check ではなく observe-only で動かし、
# sccache hit rate と swatinem/rust-cache の "full match: true/false" を
# Job Summary に出して 3 step を比較する。
#
# Step 1 (済): baseline
#   - shared-key を `exp-test-a` / `exp-test-b` で別々に持つ (alc-api と同じ悪い構造を縮約再現)
#   - save-if は main 限定 (= PR では cache 保存しない)
#   - cleanup は base 名で最新 1 世代だけ残す
#
# Step 2 (済): cleanup を最新 3 世代保持に緩和 (KEEP_GENERATIONS=3)
#
# Step 3 (現在): shared-key 統合 + 非対称 save-if
#   - shared-key を `exp-test-shared` 1 個に統合 (a/b 共有)
#   - cache-warm matrix を 1 job に畳んで、その 1 job だけ save-if: true で全 dep を save
#   - test-matrix の 並列 2 job は save-if: false で read-only restore
#     (並列 save 競合を回避しつつ、main warm の cache を共有 read する)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/cache-experiment.yml'
      - 'tests/cache_experiment_*.rs'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-experiment.yml'
      - 'tests/cache_experiment_*.rs'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read
  # cache-cleanup 用 (gh cache delete)
  actions: write

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # main push 時のみ走らせる cache warmer。
  # Step 3: matrix を畳んで 1 job だけにし、その 1 job が a/b 両 test の dep を build → save する。
  # save-if: true は main warm のここだけ。並列 save 競合の発生源を絶つ。
  cache-warm:
    name: "Exp Warm (shared)"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: exp-test-shared
          save-if: 'true'  # main warm の 1 job だけが save する (非対称設計)
      - name: Warm build (a + b 両方の dep を 1 つの target/ に揃える)
        run: |
          cargo test --test cache_experiment_a --no-run --locked
          cargo test --test cache_experiment_b --no-run --locked
      - name: Report sccache stats
        run: |
          {
            echo "## Step 3 Warm (shared) — sccache stats"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # PR / main push の両方で走らせる test 並列 matrix。
  # Step 3: shared-key を 1 個に統合、ただし save-if: false で read-only restore のみ。
  # main warm の 1 job が save した cache を 2 job が並列 read するため save 競合は起こらない。
  test-matrix:
    name: "Exp Test (${{ matrix.group.name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: "a", cmd: "--test cache_experiment_a" }
          - { name: "b", cmd: "--test cache_experiment_b" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: exp-test-shared
          save-if: 'false'  # 並列 job からは絶対 save しない (Step 3 の肝)
      - name: Run test
        run: cargo test ${{ matrix.group.cmd }} --locked
      - name: Report sccache stats + cache hit
        run: |
          {
            echo "## Step 3 (shared-key + 非対称 save-if) — group ${{ matrix.group.name }}"
            echo ""
            echo "### swatinem/rust-cache"
            echo "- cache hit: \`${{ steps.rust-cache.outputs.cache-hit }}\`"
            echo ""
            echo "### sccache --show-stats"
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # alc-api ci.yml L92-135 の cache-cleanup を縮約。Step 2 で 3 世代保持に緩和済。
  # Step 3 では shared-key が `exp-test-shared` 1 個に統合されているので、base 数も 1 個に減る。
  cache-cleanup:
    name: "Exp Cache Cleanup"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [cache-warm]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Show current cache usage and prune stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_GENERATIONS: '3'  # Step 2: 最新 3 世代に緩和
        run: |
          set -euo pipefail
          echo "::group::Current cache usage"
          gh cache list -R ${{ github.repository }} --sort size_in_bytes --order desc --limit 50 \
            --json key,sizeInBytes --jq '.[] | "\(.sizeInBytes / 1048576 | floor)MB\t\(.key)"' || true
          echo "::endgroup::"

          echo "::group::Cleaning stale exp-* entries (keep latest $KEEP_GENERATIONS per base)"
          gh cache list -R ${{ github.repository }} --limit 200 \
            --json id,key,sizeInBytes,lastAccessedAt \
            --jq '.[] | select(.key | startswith("v0-rust-exp-"))' | python3 - <<PY
          import json, os, sys
          keep = int(os.environ.get("KEEP_GENERATIONS", "1"))
          entries = [json.loads(line) for line in sys.stdin if line.strip()]
          groups = {}
          for e in entries:
              base = '-'.join(e['key'].rsplit('-', 1)[:-1])
              groups.setdefault(base, []).append(e)
          to_delete = []
          for base, items in groups.items():
              items.sort(key=lambda x: x['lastAccessedAt'], reverse=True)
              to_delete.extend(items[keep:])
          with open('/tmp/cache-ids.txt', 'w') as f:
              for d in to_delete:
                  print(f"Deleting {d['sizeInBytes']//1048576}MB {d['key']}")
                  f.write(str(d['id']) + '\n')
          print(f"Total: {len(to_delete)} stale entries (keep={keep})")
          PY
          if [ -s /tmp/cache-ids.txt ]; then
            while read -r id; do
              gh cache delete "$id" -R ${{ github.repository }} 2>/dev/null || true
            done < /tmp/cache-ids.txt
          fi
          echo "::endgroup::"
