name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # fmt / clippy / test / build (+ coverage_100.toml があれば 100% gate)
  ci:
    uses: ippoan/ci-workflows/.github/workflows/rust-ci.yml@main
    with:
      binary_name: rust-flickr
      shared_key: rust-flickr

  # ts-rs が生成する bindings/*.ts が最新の Rust struct と一致していることを gate
  # (型ドリフト検出、Refs #1)。cargo test 時に ts-rs が bindings/ を再生成するので
  # working tree に差分 / untracked が出たら fail。
  ts-bindings:
    name: ts-rs bindings drift check
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-flickr
          cache-targets: false
      - name: Regenerate bindings (ts-rs export tests)
        run: cargo test export_bindings --locked
      - name: Fail on drift
        run: |
          set -euo pipefail
          STATUS=$(git status --porcelain bindings/)
          if [ -n "$STATUS" ]; then
            echo "$STATUS"
            git diff bindings/ || true
            echo "::error::bindings/ が src/types.rs と乖離しています。ローカルで 'cargo test export_bindings' を実行して bindings/ を commit してください"
            exit 1
          fi
          echo "bindings/ up to date"

  # musl static binary を CI ランナー側でビルド (sccache + rust-cache が効く) し、
  # packaging-only Dockerfile (FROM scratch + COPY) で GHCR に push する。
  # rust-alc-api の「runner で build → Docker は COPY だけ」方式 (Refs #1)。
  build-image:
    name: Build image (musl + scratch)
    needs: [ci]
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CARGO_TERM_COLOR: always
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-flickr-musl
          cache-targets: false

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build (musl static)
        env:
          # ring (rustls の C 部分) のクロスビルドに musl-gcc を明示
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl --locked

      - run: sccache --show-stats

      - name: Verify static link + report binary size
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-musl/release/rust-flickr
          file "$BIN"
          # scratch では動的リンクは即死するので static であることを gate する
          if ! file "$BIN" | grep -qE 'static(ally linked|-pie linked)'; then
            echo "::error::binary is not statically linked (scratch では起動不能)"
            exit 1
          fi
          SIZE=$(stat -c %s "$BIN")
          {
            echo "### Binary size (musl static, stripped)"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| size | $(numfmt --to=iec "$SIZE") ($SIZE bytes) |"
            echo "| file | \`$(file -b "$BIN")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker context
        run: |
          mkdir -p ctx
          cp target/x86_64-unknown-linux-musl/release/rust-flickr ctx/
          cp Dockerfile ctx/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ctx
          push: true
          # provenance attestation を切って plain manifest にする (image size 計測を単純化)
          provenance: false
          tags: |
            ghcr.io/ippoan/rust-flickr:${{ steps.meta.outputs.tag }}
            ghcr.io/ippoan/rust-flickr:latest

      - name: Report image size (compressed)
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/ippoan/rust-flickr:${{ steps.meta.outputs.tag }}"
          docker buildx imagetools inspect "$IMAGE" --raw > manifest.json
          LAYERS=$(jq '[.layers[].size] | add' manifest.json)
          {
            echo "### Image size (scratch, compressed layers)"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| image | \`$IMAGE\` |"
            echo "| layers total | $(numfmt --to=iec "$LAYERS") ($LAYERS bytes) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # staging deploy: ci-workflows の cloud-run-deploy.yml reusable。
  # AR remote-repo (pull-through cache) 経由で digest pin した image を流す。
  # Auth は WIF (GCP key 0 個運用)。
  #
  # gate: repo variable `STAGING_DEPLOY_ENABLED=true` を user が設定するまで skip。
  # (org-level に GCP_WIF_* vars が存在しても、本 repo の WIF binding +
  #  Cloud Run service 初回作成が済むまでは deploy が確実に fail するため、
  #  setup 完了の明示 flag として repo var を別に置く。README の手順参照)
  deploy-staging:
    name: Deploy (staging)
    needs: [ci, build-image]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft != true &&
      vars.STAGING_DEPLOY_ENABLED == 'true' &&
      vars.GCP_WIF_PROVIDER != '' &&
      vars.GCP_WIF_SERVICE_ACCOUNT_STAGING != ''
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ippoan/ci-workflows/.github/workflows/cloud-run-deploy.yml@main
    with:
      service: rust-flickr-staging
      region: asia-northeast1
      project: cloudsql-sv
      ghcr_image: ghcr.io/ippoan/rust-flickr
      image_tag: ${{ needs.build-image.outputs.image_tag }}
      ar_repo: asia-northeast1-docker.pkg.dev/cloudsql-sv/ghcr/ippoan/rust-flickr
      workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_STAGING }}
      # 値は Secret Manager 参照 (secretKeyRef) で注入 — workflow / log を経由しない。
      # Secret 本体の投入は user の one-time setup (README「Secrets」参照)。
      # 未投入のまま deploy すると revision が起動失敗するため、投入完了までは
      # この 2 行を有効化しつつ secret が存在することが前提になる。
      #
      # CAM_* も全て Secret Manager 参照にする (Refs #20)。rust-flickr は public repo
      # なので、カメラの URL / machine name も plain env (set_env_vars) には置かず
      # secret 化する。set_env_vars は --set-env-vars (= plain env を毎 deploy で完全
      # リセット) なので、plain で置くと過去に手動投入した CAM_* が deploy ごとに
      # 吹き飛ぶ (= state.cam=None → /sync が 503、/stats の total_unuploaded が
      # upload floor を引けず全期間 COUNT に fallback し、daily mail の「未アップロード残」
      # が SD ローテーション済みの古い行を数え続け減らない。#19 の floor が効かない)。
      # update_secrets は --update-secrets (= additive) なので既存 binding は壊さない。
      # カメラが CF Access 越しでない構成なら CAM_CF_ACCESS_CLIENT_ID / _SECRET の
      # 2 entry を外す。
      update_secrets: FLICKR_CONSUMER_KEY=rust-flickr-consumer-key:latest,FLICKR_CONSUMER_SECRET=rust-flickr-consumer-secret:latest,DATABASE_URL=rust-flickr-database-url:latest,CAM_DIGEST_USER=rust-flickr-cam-digest-user:latest,CAM_DIGEST_PASS=rust-flickr-cam-digest-pass:latest,CAM_MACHINE_NAME=rust-flickr-cam-machine-name:latest,CAM_SDCARD_CGI=rust-flickr-cam-sdcard-cgi:latest,CAM_MP4_CGI=rust-flickr-cam-mp4-cgi:latest,CAM_JPG_CGI=rust-flickr-cam-jpg-cgi:latest,CAM_CF_ACCESS_CLIENT_ID=rust-flickr-cam-cf-access-client-id:latest,CAM_CF_ACCESS_CLIENT_SECRET=rust-flickr-cam-cf-access-client-secret:latest
      set_env_vars: FLICKR_CALLBACK_URL=https://test.mtamaramu.com/flickr/callback

  # 全 CI job が success / skipped した時だけ auto-merge を enable する
  # (release-wave-gcp と同 pattern)。`needs:` が success 評価された時点で
  # 「全 CI green が確定」しているため、required check 未設定でも CI fail 中の
  # 誤 merge は起きない。deploy-staging は vars 未設定時 skip なので
  # `|| skipped` も許容する。
  auto-merge:
    name: Auto Merge
    needs: [ci, ts-bindings, build-image, deploy-staging]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.ci.result == 'success' &&
      needs.ts-bindings.result == 'success' &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
    # auto-merge.yml は CI_APP_ID / CI_APP_PRIVATE_KEY (org secret, GitHub App)
    # で installation token を mint する (github.token fallback は撤去済 =
    # ci-workflows#65)。least-privilege: 必要な 2 secret だけ named で渡す。
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
